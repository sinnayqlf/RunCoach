<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunCoach</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--card:#ffffff;--tx:#0f1419;--mut:#687182;--ac:#ff5a1f;--ac2:#ff8a3d;--ln:#e8ecf2;--ok:#10b981;--ko:#ef4444;--warn:#f59e0b;--blue:#3b82f6;--violet:#8b5cf6;--amber:#f59e0b;--radius:16px;--shadow:0 1px 3px rgba(15,20,25,.04),0 4px 12px rgba(15,20,25,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0d12;--card:#161a21;--tx:#f4f6fa;--mut:#8b95a7;--ln:#232a35}}
:root[data-theme="dark"]{--bg:#0a0d12;--card:#161a21;--tx:#f4f6fa;--mut:#8b95a7;--ln:#232a35}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;padding:20px 18px 160px;min-height:100vh}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0;line-height:1.15}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:12px 0;line-height:1.2}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--ln)}
.mut{color:var(--mut);font-size:13.5px;line-height:1.5}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:15px 20px;background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;width:100%;margin-top:10px;cursor:pointer;box-shadow:0 4px 12px rgba(255,90,31,.25);transition:transform .12s ease,box-shadow .12s ease;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.98)}
button.alt{background:var(--card);color:var(--tx);border:1.5px solid var(--ln);box-shadow:none}
button.alt:hover{border-color:var(--ac);color:var(--ac)}
input,select{font:inherit;width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);margin:6px 0 12px;font-weight:500;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,90,31,.12)}
label{font-size:13px;color:var(--mut);font-weight:600;display:block;margin-top:4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{padding:10px 16px;border-radius:100px;border:1.5px solid var(--ln);background:var(--card);cursor:pointer;font-size:14px;font-weight:600;transition:all .15s ease;color:var(--tx);-webkit-tap-highlight-color:transparent}
.chip.on{background:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(255,90,31,.3)}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:14px 0 12px;font-size:11px;color:var(--mut);cursor:pointer;font-weight:600;letter-spacing:.01em;position:relative}
nav a.on{color:var(--ac)}
nav a.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--ac);border-radius:0 0 3px 3px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--ln);margin-right:6px}
.tag.t-easy{background:rgba(16,185,129,.15);color:var(--ok)}
.tag.t-quality{background:rgba(255,90,31,.15);color:var(--ac)}
.tag.t-recovery{background:rgba(139,92,246,.15);color:var(--violet)}
.tag.t-long{background:rgba(59,130,246,.15);color:var(--blue)}
.tag.t-quality2{background:rgba(245,158,11,.15);color:var(--amber)}
.tag.t-race{background:rgba(239,68,68,.15);color:var(--ko)}
.warn{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 6%,var(--card))}
.bar{height:10px;border-radius:5px;background:var(--ln);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s ease;border-radius:5px}
.s{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:1px solid var(--ln);cursor:pointer;margin:0 -16px;-webkit-tap-highlight-color:transparent}
.s:first-of-type{border-top:0}
.s:active{background:color-mix(in srgb,var(--ln) 50%,transparent)}
.hero{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 8px}
.runner{width:220px;height:200px;color:var(--ac);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.runner{animation:none}}
.hero h1{font-size:48px;font-weight:800;letter-spacing:-.03em;margin:12px 0 8px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag2{color:var(--mut);margin:0 0 20px;max-width:320px;font-size:15px}
.pts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.pts span{font-size:13px;padding:8px 14px;border-radius:100px;background:var(--card);border:1px solid var(--ln);font-weight:500}
.splash{text-align:center;margin-top:30vh}
.score-hero{text-align:center;padding:22px 18px}
.score-hero .big{font-size:56px;font-weight:800;line-height:1;margin:8px 0;letter-spacing:-.03em}
.score-hero .big.ok{color:var(--ok)}.score-hero .big.mid{color:var(--warn)}.score-hero .big.low{color:var(--ko)}
.score-hero .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.score-hero .sub{font-size:14px;margin-top:10px}
.gauge{height:14px;border-radius:7px;background:var(--ln);overflow:hidden;margin:12px 0 6px}
.gauge i{display:block;height:100%;transition:width .5s ease;border-radius:7px}
.crit{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-top:1px solid var(--ln)}
.crit:first-of-type{border-top:0}
.crit b{font-weight:600}
.pill{display:inline-block;font-size:12px;padding:4px 10px;border-radius:10px;background:var(--ln);margin-right:4px;font-weight:600}
.pill.ok{background:rgba(16,185,129,.15);color:var(--ok)}
.pill.ko{background:rgba(239,68,68,.15);color:var(--ko)}
.pill.warn{background:rgba(245,158,11,.15);color:var(--warn)}
.sticky-bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;padding:12px 18px;background:var(--bg);border-top:1px solid var(--ln);z-index:9}
.det-hero{padding:22px 20px;border-radius:var(--radius);margin:12px 0;position:relative;overflow:hidden}
.det-hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.det-hero .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.dur-badge{display:inline-block;font-size:13px;padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.25);font-weight:600;backdrop-filter:blur(10px)}
.acc-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:12px 0;-webkit-tap-highlight-color:transparent;font-weight:600}
.acc-body{display:none;padding-top:8px}
.acc-open .acc-body{display:block}
.acc-open .acc-arrow{transform:rotate(180deg)}
.acc-arrow{transition:transform .2s;color:var(--mut)}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:6px 0 4px;padding:0;--fill:0%;--bar:#ff5a1f}
input[type="range"]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bar),var(--bar)) no-repeat,var(--ln);background-size:var(--fill) 100%;transition:background-size .1s ease}
input[type="range"]::-moz-range-track{height:10px;border-radius:5px;background:var(--ln)}
input[type="range"]::-moz-range-progress{height:10px;border-radius:5px;background:var(--bar)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--bar);box-shadow:0 2px 8px color-mix(in srgb,var(--bar) 40%,transparent);margin-top:-7px;cursor:pointer;transition:transform .12s}
input[type="range"]::-webkit-slider-thumb:active{transform:scale(1.15)}
input[type="range"]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--bar);box-shadow:0 2px 8px color-mix(in srgb,var(--bar) 40%,transparent);cursor:pointer}
.chart-card{padding:16px 12px 12px}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.chart-svg .grid{stroke:var(--ln);stroke-width:1;stroke-dasharray:3 3}
.chart-svg .line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart-svg .dot{fill:var(--card);stroke-width:2.5}
.chart-svg .lbl{font-size:10px;fill:var(--mut);font-weight:600}
.chart-svg .lbl-cur{fill:var(--ac);font-weight:700}
.kpi-big{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi-sub{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.delta{font-size:12px;font-weight:700;padding:2px 8px;border-radius:100px;display:inline-block;margin-top:4px}
.delta.up{background:rgba(255,90,31,.15);color:var(--ac)}
.delta.down{background:rgba(16,185,129,.15);color:var(--ok)}
.delta.flat{background:var(--ln);color:var(--mut)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#app.animate>*{animation:fadeIn .3s ease}
.card:active{transition:transform .1s}
button:not(.alt):active{box-shadow:0 2px 6px rgba(255,90,31,.2)}
.confetti{position:fixed;top:-10px;width:10px;height:10px;pointer-events:none;z-index:9999;opacity:.9;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.finish-hero{text-align:center;padding:30px 16px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:var(--radius);color:#fff;margin:12px 0}
.finish-hero .emoji{font-size:64px;line-height:1;margin-bottom:8px;display:inline-block;animation:bob 1.4s ease-in-out infinite}
.finish-hero h1{font-size:32px;font-weight:800;letter-spacing:-.03em;color:#fff;-webkit-text-fill-color:#fff;margin:6px 0}
.finish-hero p{opacity:.95;margin:6px 0 0;font-size:15px}
  .test-hero{padding:22px 18px;text-align:center;background:linear-gradient(135deg,rgba(255,90,31,.08),rgba(255,138,61,.04));border:1.5px solid rgba(255,90,31,.25);border-radius:var(--radius);margin:12px 0}
.test-hero .vma-big{font-size:52px;font-weight:800;letter-spacing:-.03em;color:var(--ac);line-height:1}
.test-badge{display:inline-block;font-size:12px;padding:4px 10px;border-radius:100px;background:var(--ln);font-weight:600;margin:4px 4px 0 0}
.test-badge.ok{background:rgba(16,185,129,.15);color:var(--ok)}
.test-badge.ko{background:rgba(245,158,11,.15);color:var(--warn)}
.locked{text-align:center;padding:30px 16px}
.locked .emoji{font-size:56px;line-height:1;margin-bottom:10px;display:block}
</style>

let S={user:null,form:{lvl:'ref',dist:10,h:0,m:50,s:0,date:'',vma:'',vmaDate:'',testDist:'',goal:'10k',weeks:12,race:'',target:'',n:3,days:[1,3,6],km:'',refs:[{dist:10,h:0,m:50,s:0,date:''}],startOpt:'next',startDate:''},plan:null,refs:[]};
let scr='splash',sel=null,tab='home',step=0,runS=null,runWatch=null,wakeLock=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const isoDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return iso(x)};
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,+b-1,+c)};

const fmtP=sp=>{if(!sp||!isFinite(sp)||sp<=0)return'—';const m=60/sp;let a=Math.floor(m),b=Math.round((m-a)*60);if(b==60){a++;b=0}return a+':'+String(b).padStart(2,'0')};

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const fmtDur=min=>{min=Math.round(min);if(min<60)return min+' min';const h=Math.floor(min/60),m=min%60;return h+'h'+String(m).padStart(2,'0')};
const minFromKm=(km,pace)=>pace>0?Math.round(km/pace*60):null;

function vmaFromRef(km,min,ageW){const t=min,v=km*1000/t;const pct=.8+.1894393*Math.exp(-.012778*t)+.2989558*Math.exp(-.1932605*t);const vo2=-4.6+.182258*v+.000104*v*v,vdot=vo2/pct;const a=.000104,b=.182258,c=-4.6-vdot;const vm=(-b+Math.sqrt(b*b-4*a*c))/(2*a);let vma=vm*.06;const fresh=Math.max(.94,1-Math.max(0,ageW-6)*.004);return r1(vma*fresh)}

function describe(s,pl){

function startGPS(){

  runWatch=navigator.geolocation.watchPosition(

      if(!runS||runS.paused)return;
      const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=pos.coords.accuracy;
      if(acc>50)return;
      const t=Date.now();
      if(runS.lastPos){
        const d=haversine(runS.lastPos.lat,runS.lastPos.lng,lat,lng);
        if(d>0.003&&d<0.2)runS.dist+=d;

      runS.lastPos={lat,lng,t};

function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

  const elP=document.getElementById('runPace');

  const p=S.plan,s=p.sessions.find(x=>x.id===sel);
  const paceKmh=runS.elapsed>10000?runS.dist/(runS.elapsed/3600000):0;
  elP.textContent=paceKmh>0?fmtP(paceKmh)+'/km':'—';
  const avgPace=runS.dist>0.05?runS.elapsed/60000/runS.dist:0;
  elAvg.textContent=avgPace>0?fmtP(60/avgPace)+'/km':'—';

  // Comparaison allure cible
  if(s&&s.type&&p.vma){
    const vBase=p.vma+(p.boost||0);
    let target=null;
    if(s.type==='easy')target=(vBase*.68+vBase*.76)/2;
    else if(s.type==='recovery')target=(vBase*.62+vBase*.70)/2;
    else if(s.type==='long')target=(vBase*.68+vBase*.76)/2;
    else if(s.type==='quality')target=(vBase*.85+vBase*.88)/2;
    else if(s.type==='quality2')target=vBase*.88;
    if(target&&paceKmh>0){
      const ratio=paceKmh/target;
      if(ratio>1.15){elStat.innerHTML='⚠️ Trop rapide';elStat.style.color='var(--warn)'}

  }

    +'</div>'

    +'<button id="instClose" style="width:100%;padding:15px;background:#ff5a1f;color:#fff;border:0;border-radius:12px;font-weight:600;font-size:16px;margin-top:6px;cursor:pointer">C\'est compris !</button>'
    +'</div>';
  document.body.appendChild(overlay);
  document.getElementById('instClose').onclick=()=>document.body.removeChild(overlay);
}
  function exportData(){
  try{
    const json=JSON.stringify(S,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const d=new Date();
    const dateStr=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.download='runcoach-sauvegarde-'+dateStr+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alert('✅ Sauvegarde téléchargée !\n\nGarde ce fichier précieusement. Tu pourras le réimporter après avoir réinstallé l\'app.');
  }catch(e){
    console.error('exportData error:',e);
    // Fallback iOS : afficher le JSON dans un textarea à copier
    showExportFallback();
  }
}
function showExportFallback(){
  const json=JSON.stringify(S);
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99999;padding:20px;display:flex;flex-direction:column;gap:10px';
  overlay.innerHTML='<h3 style="color:#fff;margin:0">Copie ta sauvegarde</h3>'
    +'<p style="color:#ccc;font-size:13px;margin:0">Sélectionne tout, copie, et garde-le quelque part (mail, notes, cloud...)</p>'
    +'<textarea id="expTxt" style="flex:1;width:100%;font-family:monospace;font-size:11px;padding:10px;border-radius:8px;border:0;resize:none">'+json+'</textarea>'
    +'<div style="display:flex;gap:10px">'
    +'<button id="expCopy" style="flex:1;padding:14px;background:#ff5a1f;color:#fff;border:0;border-radius:12px;font-weight:600;font-size:16px">📋 Tout copier</button>'
    +'<button id="expClose" style="flex:1;padding:14px;background:#fff;color:#000;border:0;border-radius:12px;font-weight:600;font-size:16px">Fermer</button>'
    +'</div>';
  document.body.appendChild(overlay);
  document.getElementById('expCopy').onclick=()=>{
    const ta=document.getElementById('expTxt');
    ta.select();
    ta.setSelectionRange(0,99999);
    try{document.execCommand('copy')}catch(e){}
    if(navigator.clipboard)navigator.clipboard.writeText(ta.value).catch(()=>{});
    alert('✅ Copié ! Colle-le dans un mail, une note, ou n\'importe où.');
  };
  document.getElementById('expClose').onclick=()=>document.body.removeChild(overlay);
}
function importData(){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;padding:20px;overflow-y:auto';
  overlay.innerHTML='<div style="max-width:480px;margin:0 auto;background:#fff;color:#000;border-radius:16px;padding:20px">'
    +'<h2 style="margin:0 0 6px;color:#0f1419">📥 Restaurer une sauvegarde</h2>'
    +'<p style="font-size:13px;line-height:1.5;color:#374151;margin:0 0 14px">Tu peux soit <b>choisir ton fichier</b> de sauvegarde, soit <b>coller le texte</b> que tu avais copié.</p>'

    +'<div style="background:#f0f9ff;border-left:4px solid #3b82f6;padding:12px;border-radius:8px;margin:0 0 14px">'
    +'<b style="color:#0f1419;font-size:14px">📁 Option 1 — Choisir un fichier</b>'
    +'<p style="font-size:12px;line-height:1.5;color:#374151;margin:6px 0 8px">Fonctionne sur Android et ordinateur. Sélectionne ton fichier <b>.json</b> de sauvegarde.</p>'
    +'<input type="file" id="impFile" accept=".json,application/json" style="width:100%;padding:8px;font-size:12px;border:1px solid #e5e7eb;border-radius:8px;background:#fff">'
    +'</div>'

    +'<div style="background:#fff7ed;border-left:4px solid #ff5a1f;padding:12px;border-radius:8px;margin:0 0 14px">'
    +'<b style="color:#0f1419;font-size:14px">📋 Option 2 — Coller le texte</b>'
    +'<p style="font-size:12px;line-height:1.5;color:#374151;margin:6px 0 8px">Recommandé sur iPhone si tu avais copié le texte dans Notes ou par mail.</p>'
    +'<textarea id="impTxt" placeholder="Colle ici le texte de ta sauvegarde..." style="width:100%;height:100px;font-family:monospace;font-size:11px;padding:10px;border-radius:8px;border:1px solid #e5e7eb;resize:none"></textarea>'
    +'</div>'

    +'<button id="impOk" style="width:100%;padding:15px;background:#ff5a1f;color:#fff;border:0;border-radius:12px;font-weight:600;font-size:16px;margin-top:6px;cursor:pointer">Restaurer</button>'
    +'<button id="impCancel" style="width:100%;padding:15px;background:#f3f4f6;color:#0f1419;border:0;border-radius:12px;font-weight:600;font-size:16px;margin-top:8px;cursor:pointer">Annuler</button>'
    +'</div>';
  document.body.appendChild(overlay);

  // Gestion du fichier sélectionné
  let fileContent=null;
  document.getElementById('impFile').onchange=(e)=>{
    const f=e.target.files[0];
    if(!f)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      fileContent=ev.target.result;
      document.getElementById('impTxt').value=fileContent;
    };
    reader.readAsText(f);
  };

  document.getElementById('impCancel').onclick=()=>document.body.removeChild(overlay);

  document.getElementById('impOk').onclick=()=>{
    // Récupère le contenu : soit le fichier, soit le textarea
    let txt=document.getElementById('impTxt').value.trim();
    if(!txt&&fileContent)txt=fileContent;
    if(!txt){alert('Choisis un fichier ou colle ton texte de sauvegarde');return}
    try{
      const data=JSON.parse(txt);
      if(!data.form){alert('❌ Ce fichier ne semble pas être une sauvegarde RunCoach valide');return}
      if(!confirm('⚠️ Tes données actuelles seront remplacées. Continuer ?'))return;
      S=data;
      if(!S.form.refs)S.form.refs=[{dist:10,h:0,m:50,s:0,date:''}];
      save();
      document.body.removeChild(overlay);
      alert('✅ Données restaurées !');
      location.reload();
    }catch(e){
      console.error('importData error:',e);
      alert('❌ Erreur : le contenu n\'est pas valide.\n\nDétail : '+e.message);
    }
  };
}
  function testVMAAllowed(){
  try{
    const p=S.plan;
    if(!p||!p.sessions)return false;
    const lvl=S.form.lvl;
    const goal=S.form.goal;
    if(lvl==='new'||goal==='reprise'){
      const anyDone=p.sessions.some(x=>x.status==='done');
      const planFinished=!p.sessions.some(x=>x.status==='todo');
      return planFinished||anyDone;
    }
    return true;
  }catch(e){console.error('testVMAAllowed error:',e);return false}
}
function launchTestVMA(){
  scr='testVMA';draw();
}
function testVMAResultHTML(d){
  const newVMA=d>0?r1(d*10):0;
  const currentVMA=level();
  if(newVMA<=0){
    return '<div class="card mut" style="text-align:center;font-size:13px">Entre ta distance pour voir ta VMA calculée automatiquement.</div>';
  }
  return '<div class="test-hero">'
    +'<div class="mut" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">VMA calculée</div>'
    +'<div class="vma-big">'+newVMA+'</div>'
    +'<div style="font-size:14px;font-weight:600;color:var(--mut);margin-top:4px">km/h</div>'
    +'<div style="margin-top:12px">'
    +(currentVMA?'<span class="test-badge">VMA actuelle : '+currentVMA+' km/h</span>':'')
    +'<span class="test-badge '+(currentVMA&&newVMA>currentVMA?'ok':currentVMA&&newVMA<currentVMA?'ko':'')+'">'
    +(currentVMA?(newVMA>currentVMA?'📈 +'+r1(newVMA-currentVMA)+' km/h':newVMA<currentVMA?'📉 '+r1(newVMA-currentVMA)+' km/h':'➡️ Identique'):'🎯 Nouvelle VMA')
    +'</span>'
    +'</div>'
    +'<button onclick="saveTestVMA()" style="margin-top:16px">Enregistrer ma VMA</button>'
    +'</div>';
}
function onTestDistInput(el){
  // Lit la valeur SANS redraw (garde le focus)
  const v=el.value===''?'':Math.max(0.5,Math.min(3,+el.value||0));
  S.form.testDist=v;
  save();
  // Met à jour juste la zone résultat sans redraw complet
  const box=document.getElementById('testVMAResult');
  if(box)box.innerHTML=testVMAResultHTML(v===''?0:+v);
}
function onTestDistBlur(el){
  // Au blur, redraw propre (avec la valeur finale)
  const v=el.value===''?'':Math.max(0.5,Math.min(3,+el.value||0));
  S.form.testDist=v;
  save();
  draw();
}
function saveTestVMA(){
  const d=+S.form.testDist||0;
  if(d<=0){alert('Entre une distance valide (en km)');return}
  if(d<0.5||d>3){alert('La distance doit être entre 0.5 et 3 km (test 6 min)');return}
  const newVMA=r1(d*10);
  S.form.vma=newVMA;
  S.form.vmaDate=iso(new Date());
  S.form.testDist='';
  save();
  alert('✅ Nouvelle VMA enregistrée : '+newVMA+' km/h\nToutes tes allures sont mises à jour.');
  setT('prof');
}
function testVMAScreen(){
  const allowed=testVMAAllowed();
  const f=S.form;
  if(!allowed){
    return '<button class="alt" onclick="setT(\'prof\')" style="width:auto;margin:0 0 10px;padding:8px 14px">← Retour</button>'
      +'<div class="locked"><span class="emoji">🔒</span><h2>Test VMA bientôt disponible</h2>'
      +'<p class="mut">Pour les <b>débutants</b> et les <b>reprises</b>, on te conseille de <b>terminer ton premier plan</b> avant de faire un test VMA.</p>'
      +'<p class="mut">Courir 6 minutes à fond, c\'est intense. Tu auras de meilleures sensations et une VMA plus fiable après quelques semaines d\'entraînement.</p>'
      +'<div class="card" style="text-align:left;margin-top:20px"><h3>💡 En attendant</h3>'
      +'<p class="mut" style="margin:0">Continue ton plan actuel. Dès que tu auras terminé, tu pourras faire le test et mettre à jour toutes tes allures.</p></div>'
      +'<button onclick="setT(\'prof\')" style="margin-top:20px">Retour au profil</button></div>';
  }
  const d=+f.testDist||0;
return '<button class="alt" onclick="setT(\'prof\')" style="width:auto;margin:0 0 10px;padding:8px 14px">← Retour</button>'
    +'<h2>🏁 Test VMA — 6 minutes</h2>'
    +'<div class="card"><h3>📋 Le protocole</h3>'
    +'<ol class="mut" style="margin:6px 0 10px 16px;padding:0">'
    +'<li>Échauffement : 15 min de footing très lent + 3 accélérations</li>'
    +'<li>Repos : 3 min de marche</li>'
    +'<li><b>Course : 6 minutes à intensité maximale</b> (allure la plus rapide que tu peux tenir sans t\'écrouler)</li>'
    +'<li>Note la <b>distance exacte</b> parcourue en km (ta montre / ton tel / ton parcours)</li>'
    +'<li>Retour au calme : 10 min de footing très lent</li>'
    +'</ol>'
    +'<p class="mut" style="margin:0"><b>Règle d\'or :</b> allure régulière, pas de sprint final. Si tu t\'écroules à la fin, tu es parti trop vite.</p></div>'
    +'<div class="card"><h3>📏 Ta distance parcourue (en km)</h3>'
+'<input type="number" step="0.01" min="0.5" max="3" value="'+d+'" placeholder="ex: 1.4" inputmode="decimal" oninput="onTestDistInput(this)" onblur="onTestDistBlur(this)">'
+'<div class="mut" style="text-align:center;font-size:12px">Entre 0.5 et 3 km (rarement plus)</div></div>'
    +'<div id="testVMAResult">'+testVMAResultHTML(d)+'</div>'
    +'<div class="card mut" style="font-size:12px;text-align:center">Formule : VMA = distance (km) × 10. Ex : 1.4 km en 6 min = 14 km/h.</div>';
}
draw();
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/RunCoach/sw.js').then(reg => {
      // 1. Vérifie les mises à jour dès le démarrage
      reg.update();
      // 2. Puis toutes les 5 minutes
      setInterval(() => reg.update(), 5*60*1000);
      // 3. Si un nouveau SW est trouvé, il s'active (via skipWaiting dans sw.js)
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        if(!newSW) return;
        newSW.addEventListener('statechange', () => {
          if(newSW.state === 'installed' && navigator.serviceWorker.controller){
            console.log('[SW] Nouvelle version prête');
            // Force l'activation du nouveau SW
            newSW.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
    }).catch(()=>{});
  });
  // Recharge la page quand un nouveau SW prend le contrôle
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(refreshing) return;
    refreshing = true;
    console.log('[SW] Nouveau SW actif, rechargement…');
    window.location.reload();
  });
}
